name: Build Game

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: dungeon-hr-linux
            executable_name: main
          - os: windows-latest
            artifact_name: dungeon-hr-windows
            executable_name: main.exe
          - os: macos-13
            artifact_name: dungeon-hr-macos-intel
            mac_zip_name: dungeon-hr-macos-intel.zip
          - os: macos-latest
            artifact_name: dungeon-hr-macos-arm64
            mac_zip_name: dungeon-hr-macos-arm64.zip
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build executable (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          pyinstaller \
            --onefile \
            --windowed \
            --add-data "tickets.json:." \
            --add-data "manager_messages.json:." \
            main.py

      - name: Build executable (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --add-data "tickets.json;." `
            --add-data "manager_messages.json;." `
            main.py

      - name: Package macOS App
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r "${{ matrix.mac_zip_name }}" main.app

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.mac_zip_name }}

      - name: Upload Linux/Windows artifact
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.executable_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: dungeon-hr-linux
          path: release/linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: dungeon-hr-windows
          path: release/windows

      - name: Download macOS Intel artifact
        uses: actions/download-artifact@v4
        with:
          name: dungeon-hr-macos-intel
          path: release/macos-intel

      - name: Download macOS ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: dungeon-hr-macos-arm64
          path: release/macos-arm64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/linux/main
            release/windows/main.exe
            release/macos-intel/dungeon-hr-macos-intel.zip
            release/macos-arm64/dungeon-hr-macos-arm64.zip
